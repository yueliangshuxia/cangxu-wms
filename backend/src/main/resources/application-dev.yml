# Local development: H2 in MySQL compatibility mode.
# Run with no external database. Switch to the mysql profile when MySQL is ready.
spring:
  datasource:
    url: jdbc:h2:mem:cangxu_wms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console

mqtt:
  enabled: false
